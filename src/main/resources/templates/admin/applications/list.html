<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Applications | Career Portal Administration</title>
    <link rel="icon" th:href="@{/images/logo/uttara-bank-mark.png}" />
    <link rel="stylesheet" th:href="@{/css/app.css(v=13)}" />
  </head>
  <body class="admin-body" data-admin-page="applications">
    <header th:replace="~{admin/fragments/header :: header}"></header>
    <div class="admin-shell">
      <aside
        th:replace="~{admin/fragments/sidebar :: sidebar('applications')}"
      ></aside>
      <main class="admin-main">
        <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
        <div class="page-head">
          <div>
            <span class="page-kicker">Candidate review</span>
            <h1>Applications</h1>
            <p>Review submitted applications by job or tracking number.</p>
          </div>
        </div>
        <section class="card application-filters">
          <div class="field">
            <label>Job</label>
            <select class="admin-job-filter" id="applicationJobFilter"></select>
          </div>
          <div class="field">
            <label>Numeric tracking number</label>
            <input
              id="trackingNumberSearch"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Enter tracking number"
            />
          </div>
          <div class="button-row">
            <button class="btn btn-primary" id="searchApplications" type="button">Search</button>
            <button class="btn btn-secondary" id="clearApplicationFilters" type="button">Clear</button>
            <button class="btn btn-secondary" id="exportApplications" type="button">Export XLSX</button>
          </div>
        </section>
        <article class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Candidate</th>
                  <th>CV number</th>
                  <th>Contact</th>
                  <th>Job</th>
                  <th>Tracking</th>
                  <th>Eligibility</th>
                  <th>Submitted</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="applicationRows"></tbody>
            </table>
          </div>
          <nav th:replace="~{admin/fragments/pagination :: pagination}"></nav>
        </article>
      </main>
    </div>
    <script th:src="@{/js/admin.js(v=16)}"></script>
  </body>
</html>
