<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Applications | Career Portal Administration</title>
    <link rel="icon" th:href="@{/images/logo/uttara-bank-mark.png}" />
    <link rel="stylesheet" th:href="@{/css/app.css(v=13)}" />
  </head>
  <body class="admin-body" data-admin-page="applications">
    <header th:replace="~{admin/fragments/header :: header}"></header>
    <div class="admin-shell">
      <aside
        th:replace="~{admin/fragments/sidebar :: sidebar('applications')}"
      ></aside>
      <main class="admin-main">
        <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
        <div class="page-head">
          <div>
            <span class="page-kicker">Candidate review</span>
            <h1>Applications</h1>
            <p>
              Find submitted applications by job, candidate identity, contact,
              eligibility or submission date.
            </p>
          </div>
        </div>
        <section class="card application-filters">
          <div class="field">
            <label>Job</label>
            <select class="admin-job-filter" id="applicationJobFilter"></select>
          </div>
          <div class="field">
            <label>CV number</label
            ><input
              id="applicationCv"
              type="search"
              maxlength="30"
              placeholder="UTB-CV-000000058"
            />
          </div>
          <div class="field">
            <label>Candidate name</label
            ><input
              id="applicationName"
              type="search"
              maxlength="200"
              placeholder="Enter candidate name"
            />
          </div>
          <div class="field">
            <label>Mobile number</label
            ><input
              id="applicationMobile"
              type="search"
              maxlength="20"
              inputmode="tel"
              placeholder="01XXXXXXXXX"
            />
          </div>
          <div class="field">
            <label>Email address</label
            ><input
              id="applicationEmail"
              type="search"
              maxlength="254"
              placeholder="candidate@example.com"
            />
          </div>
          <div class="field">
            <label>Eligibility</label
            ><select id="applicationEligibility">
              <option value="">All eligibility statuses</option>
              <option>ELIGIBLE</option>
              <option>INELIGIBLE</option>
              <option>PENDING</option>
            </select>
          </div>
          <div class="field">
            <label>Submitted from</label
            ><input id="applicationSubmittedFrom" type="date" />
          </div>
          <div class="field">
            <label>Submitted to</label
            ><input id="applicationSubmittedTo" type="date" />
          </div>
          <div class="field">
            <label>Numeric tracking number</label>
            <input
              id="trackingNumberSearch"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Enter tracking number"
            />
          </div>
          <div class="button-row">
            <button
              class="btn btn-primary"
              id="searchApplications"
              type="button"
            >
              Search
            </button>
            <button
              class="btn btn-secondary"
              id="clearApplicationFilters"
              type="button"
            >
              Clear
            </button>
            <button
              class="btn btn-secondary"
              id="exportApplications"
              type="button"
            >
              Export XLSX
            </button>
          </div>
        </section>
        <article class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Candidate</th>
                  <th>CV number</th>
                  <th>Contact</th>
                  <th>Job</th>
                  <th>Tracking</th>
                  <th>Eligibility</th>
                  <th>Submitted</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="applicationRows"></tbody>
            </table>
          </div>
          <nav th:replace="~{admin/fragments/pagination :: pagination}"></nav>
        </article>
      </main>
    </div>
    <script th:src="@{/js/admin.js(v=25)}"></script>
  </body>
</html>
