<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jobs | Career Portal Administration</title>
    <link rel="icon" th:href="@{/images/logo/uttara-bank-mark.png}" />
    <link rel="stylesheet" th:href="@{/css/app.css(v=6)}" />
  </head>
  <body class="admin-body" data-admin-page="jobs">
    <header th:replace="~{admin/fragments/header :: header}"></header>
    <div class="admin-shell">
      <aside th:replace="~{admin/fragments/sidebar :: sidebar('jobs')}"></aside>
      <main class="admin-main">
        <div th:replace="~{admin/fragments/alerts :: alerts}"></div>
        <div class="page-head">
          <div>
            <span class="page-kicker">Job management</span>
            <h1>Recruitment jobs</h1>
            <p>Create, approve, publish, and close job postings.</p>
          </div>
          <a class="btn btn-primary" th:href="@{/admin/jobs/new}">Create job</a>
        </div>
        <div class="list" id="adminJobList"></div>
      </main>
    </div>
    <script th:src="@{/js/admin.js(v=3)}"></script>
  </body>
</html>
