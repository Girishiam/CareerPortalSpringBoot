<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Positions | Uttara Bank Career Portal</title>
    <link rel="icon" th:href="@{/images/logo/uttara-bank-mark.png}" />
    <link rel="stylesheet" th:href="@{/css/app.css(v=13)}" />
  </head>
  <body class="admin-body" data-portal-page="jobs">
    <header th:replace="~{portal/fragments/header :: header}"></header>
    <div class="admin-shell">
      <aside
        th:replace="~{portal/fragments/sidebar :: sidebar('jobs')}"
      ></aside>
      <main class="admin-main">
        <div th:replace="~{portal/fragments/alerts :: alerts}"></div>
        <div class="page-head">
          <div>
            <span class="page-kicker">Career opportunities</span>
            <h1>Open positions</h1>
            <p>
              Explore currently published vacancies and application deadlines.
            </p>
          </div>
          <button class="btn btn-secondary" id="refreshJobs" type="button">
            Refresh positions
          </button>
        </div>
        <div class="list job-list" id="jobList"></div>
      </main>
    </div>
    <script th:src="@{/js/portal.js(v=9)}"></script>
  </body>
</html>
