<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Education | Uttara Bank Career Portal</title>
    <link rel="icon" th:href="@{/images/logo/uttara-bank-mark.png}" />
    <link rel="stylesheet" th:href="@{/css/app.css(v=22)}" />
  </head>
  <body class="admin-body" data-portal-page="education">
    <header th:replace="~{portal/fragments/header :: header}"></header>
    <div class="admin-shell">
      <aside
        th:replace="~{portal/fragments/sidebar :: sidebar('education')}"
      ></aside>
      <main class="admin-main">
        <div th:replace="~{portal/fragments/alerts :: alerts}"></div>
        <div
          th:replace="~{portal/profile/stepper :: stepper('education')}"
        ></div>
        <div class="page-head">
          <div>
            <span class="page-kicker">Qualifications</span>
            <h1>Education</h1>
            <p>Add your academic history.</p>
          </div>
          <button class="btn btn-primary" id="toggleEducationForm">
            Add education
          </button>
        </div>
        <form class="card form-card" id="educationForm" hidden>
          <p class="required-note">Fields marked with * are required.</p>
          <div class="form-grid">
            <div class="field">
              <label>Qualification *</label
              ><select name="qualificationId" required></select>
            </div>
            <div class="field" id="otherQualificationField" hidden>
              <label>Other qualification *</label
              ><input name="qualificationName" maxlength="200" disabled />
            </div>
            <div class="field">
              <label>Subject / group *</label
              ><select name="subjectId" required></select>
            </div>
            <div class="field" id="otherSubjectField" hidden>
              <label>Other subject / group *</label
              ><input name="subjectName" maxlength="200" disabled />
            </div>
            <div class="field">
              <label>University / Board *</label
              ><select name="institutionId" required></select>
            </div>
            <div class="field" id="otherInstitutionField" hidden>
              <label>Other university / board *</label
              ><input name="institutionName" maxlength="200" disabled />
            </div>
            <div class="field">
              <label>Result type *</label
              ><select name="resultType" required>
                <option value="CGPA">CGPA</option>
                <option value="GPA">GPA</option>
                <option value="DIVISION">Division</option>
                <option value="CLASS">Class</option>
              </select>
            </div>
            <div class="field" id="resultValueField">
              <label>Result value *</label
              ><input
                name="resultValue"
                type="number"
                min="0"
                step="0.01"
                required
              />
            </div>
            <div class="field" id="resultScaleField">
              <label>Result scale *</label
              ><input
                name="resultScale"
                type="number"
                min="0.01"
                step="0.01"
                required
              />
            </div>
            <div class="field" id="resultGradeField" hidden>
              <label>Division or class *</label
              ><input name="resultGrade" maxlength="30" disabled />
            </div>
            <div class="field">
              <label>Passing year *</label
              ><input name="passingYear" type="number" min="1950" required />
            </div>
            <div class="field checkbox-field">
              <label
                ><input name="isHighestDegree" type="checkbox" /> Highest
                degree</label
              >
            </div>
          </div>
          <div class="form-footer">
            <span class="hint">Results are validated before saving.</span>
            <div class="button-row">
              <button
                class="btn btn-secondary"
                id="cancelEducationEdit"
                type="button"
                hidden
              >
                Cancel
              </button>
              <button class="btn btn-primary" id="saveEducation">
                Save education
              </button>
            </div>
          </div>
        </form>
        <div class="card"><div class="list" id="educationList"></div></div>
        <div class="form-footer cv-step-actions">
          <span class="hint">Add every qualification before continuing.</span
          ><a class="btn btn-primary" href="/portal/profile/experience"
            >Continue to experience</a
          >
        </div>
      </main>
    </div>
    <script th:src="@{/js/portal.js(v=28)}"></script>
  </body>
</html>
